<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4 - State-Driven Note Keeper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <h1>My Note Keeper</h1>
        
        <div class="input-area">
            <input type="text" id="note-input" placeholder="Write a new note...">
            <button id="add-btn">Add Note</button>
        </div>

        <!-- The display area that will be completely driven by JavaScript State -->
        <div id="notes-container" class="notes-list">
            <!-- Notes will be injected here -->
        </div>
        
        <div class="stats">
            <p>Total Notes: <span id="note-count">0</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
